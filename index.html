<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Project Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --cream:#FAF7F2;--warm:#F0EAE0;--g-dark:#1C3A2E;--g-mid:#2D5A41;--g-light:#4A7A5E;
  --gold:#B8962E;--gold-l:#EDD9A3;--amber:#8B6914;--char:#1C2419;--gray:#8A8578;
  --border:#DDD7CC;--red:#991B1B;--purple:#5B21B6;
}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--char);}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
#overlay{position:fixed;inset:0;background:rgba(250,247,242,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;gap:14px;transition:opacity .3s;}
#overlay.hidden{opacity:0;pointer-events:none;}
.spinner{width:36px;height:36px;border:2px solid var(--border);border-top-color:var(--g-dark);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.ov-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-style:italic;color:var(--g-dark);}
.ov-sub{font-size:11px;color:var(--gray);letter-spacing:.14em;text-transform:uppercase;}
header{background:var(--g-dark);color:#F5EDD8;padding:14px 24px;display:flex;align-items:center;gap:18px;flex-shrink:0;}
.h-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;letter-spacing:.04em;line-height:1;}
.h-sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(245,237,216,.45);margin-top:3px;font-weight:300;}
.spacer{flex:1;}
.legend{display:flex;align-items:center;gap:14px;}
.l-item{display:flex;align-items:center;gap:5px;font-size:10px;color:rgba(245,237,216,.5);text-transform:uppercase;letter-spacing:.08em;}
.l-dot{width:9px;height:9px;border-radius:2px;}
.l-dot.past{background:#A3C9B0;}.l-dot.future{background:#E8D5A0;}.l-dot.empty{background:rgba(255,255,255,.15);}
.ts-badge{display:flex;align-items:center;gap:7px;background:rgba(184,150,46,.12);border:1px solid rgba(184,150,46,.35);color:var(--gold-l);padding:6px 13px;border-radius:4px;font-size:11px;white-space:nowrap;}
.ts-badge svg{width:12px;height:12px;opacity:.7;flex-shrink:0;}
.refresh-btn{display:flex;align-items:center;gap:7px;padding:6px 13px;border-radius:4px;border:1px solid rgba(245,237,216,.2);background:rgba(245,237,216,.08);color:rgba(245,237,216,.7);font-family:'DM Sans',sans-serif;font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.refresh-btn:hover{background:rgba(245,237,216,.15);color:#F5EDD8;}
.refresh-btn:disabled{opacity:.5;cursor:wait;}
.refresh-btn.spin svg{animation:spin .7s linear infinite;}
#stats-bar{background:var(--g-dark);border-top:1px solid rgba(255,255,255,.06);padding:10px 24px;display:flex;align-items:center;gap:28px;flex-shrink:0;}
.stat{display:flex;flex-direction:column;gap:1px;}
.stat-val{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:var(--gold-l);line-height:1;}
.stat-lbl{font-size:9px;color:rgba(245,237,216,.4);text-transform:uppercase;letter-spacing:.12em;}
.stat-div{width:1px;height:32px;background:rgba(255,255,255,.1);}
#tabs{background:var(--warm);border-bottom:1px solid var(--border);padding:0 24px;display:flex;flex-shrink:0;}
.tab{padding:11px 20px;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:var(--gray);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;}
.tab.on{color:var(--g-dark);border-bottom-color:var(--g-dark);}
.tab:hover:not(.on){color:var(--g-mid);}
#filter-bar{background:var(--warm);border-bottom:1px solid var(--border);padding:9px 24px;display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap;}
.pill{padding:4px 12px;border-radius:100px;font-size:10px;font-weight:500;cursor:pointer;border:1px solid var(--border);color:var(--gray);transition:all .15s;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;}
.pill.on{background:var(--g-dark);color:white;border-color:var(--g-dark);}
.pill:hover:not(.on){border-color:var(--g-mid);color:var(--g-mid);}
.search{margin-left:auto;background:white;border:1px solid var(--border);border-radius:4px;padding:5px 12px;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--char);outline:none;width:190px;transition:border-color .2s;}
.search:focus{border-color:var(--g-light);}
.search::placeholder{color:var(--gray);}
#panel-table{flex:1;overflow:hidden;display:flex;flex-direction:column;}
.tbl-wrap{flex:1;overflow:auto;}
table{border-collapse:collapse;width:max-content;min-width:100%;}
thead{position:sticky;top:0;z-index:10;}
thead th{background:var(--g-dark);padding:0;border-right:1px solid rgba(255,255,255,.07);}
thead th .th-inner{padding:10px 8px 9px;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.09em;color:rgba(245,237,216,.6);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px;}
thead th:first-child{position:sticky;left:0;z-index:11;border-right:2px solid rgba(255,255,255,.12);}
thead th:first-child .th-inner{text-align:left;padding-left:24px;min-width:220px;max-width:220px;}
tbody tr{border-bottom:1px solid var(--border);}
tbody tr:hover td{background:var(--warm) !important;}
tbody tr:nth-child(even) td{background:rgba(240,234,224,.45);}
tbody tr:nth-child(even):hover td{background:var(--warm) !important;}
tbody td{background:var(--cream);}
td.pname{position:sticky;left:0;z-index:5;padding:10px 14px 10px 24px;min-width:220px;max-width:220px;border-right:2px solid var(--border);}
.pn-text{font-size:13px;font-weight:500;color:var(--char);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.src-badges{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap;}
.src-badge{font-size:8px;text-transform:uppercase;letter-spacing:.07em;font-weight:500;padding:1px 5px;border-radius:2px;}
.src-badge.calendar{background:#E8F2EC;color:var(--g-mid);}
.src-badge.teamup{background:#EDE9FE;color:var(--purple);}
.src-badge.asana{background:#FEF3C7;color:#92400E;}
td.dcell{padding:8px 4px;text-align:center;min-width:90px;border-right:1px solid var(--border);vertical-align:middle;}
.chip{display:inline-block;padding:3px 8px;border-radius:4px;font-size:10px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums;}
.chip.past{background:#E8F2EC;color:var(--g-mid);border:1px solid #C2DEC9;}
.chip.fut{background:#FBF3E0;color:var(--amber);border:1px solid #E8D5A0;}
.chip.today{background:#FEF3C7;color:#92400E;border:1px solid #FDE68A;}
.dash{width:18px;height:2px;background:var(--border);margin:0 auto;border-radius:2px;}
.empty{padding:60px 24px;text-align:center;color:var(--gray);font-size:13px;font-style:italic;}
.err-msg{padding:40px 24px;text-align:center;color:var(--red);font-size:13px;}
#panel-timing{flex:1;overflow:auto;padding:28px 32px;display:none;}
#panel-timing.show{display:block;}
.timing-header{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--g-dark);margin-bottom:6px;}
.timing-sub{font-size:12px;color:var(--gray);margin-bottom:24px;font-style:italic;}
.phase-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:24px;}
.ph-sum-card{background:white;border:1px solid var(--border);border-radius:10px;padding:20px 22px;border-top:4px solid var(--ph-color);cursor:pointer;transition:box-shadow .15s,transform .1s;}
.ph-sum-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);transform:translateY(-1px);}
.ph-sum-card.no-data{cursor:default;opacity:.7;}
.ph-sum-card.no-data:hover{box-shadow:none;transform:none;}
.ph-sum-label{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:var(--g-dark);margin-bottom:3px;}
.ph-sum-range{font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:.09em;margin-bottom:12px;}
.ph-sum-avg{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:600;line-height:1;color:var(--ph-color);}
.ph-sum-avg span{font-size:15px;font-weight:400;color:var(--gray);font-family:'DM Sans',sans-serif;}
.ph-sum-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--gray);margin-top:10px;border-top:1px solid var(--border);padding-top:10px;}
.ph-sum-meta strong{color:var(--char);}
.click-hint{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--g-light);margin-top:8px;font-weight:500;}
.timing-divider{display:flex;align-items:center;gap:14px;margin:4px 0 20px;color:var(--gray);}
.timing-divider::before,.timing-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.timing-divider span{font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:500;white-space:nowrap;}
.timing-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.t-card{background:white;border:1px solid var(--border);border-radius:8px;padding:16px 18px;position:relative;overflow:hidden;transition:box-shadow .15s,transform .1s;}
.t-card.clickable{cursor:pointer;}
.t-card.clickable:hover{box-shadow:0 4px 14px rgba(0,0,0,.07);transform:translateY(-1px);}
.t-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--g-light);}
.t-card.no-data::before{background:var(--border);}
.t-arrow{font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:.09em;font-weight:500;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.t-avg{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;color:var(--g-dark);line-height:1.1;}
.t-avg span{font-size:13px;font-weight:400;color:var(--gray);font-family:'DM Sans',sans-serif;}
.t-need{font-size:12px;color:var(--gray);font-style:italic;margin-top:4px;}
.t-need strong{color:var(--amber);}
.t-bar-wrap{margin:10px 0 8px;background:var(--warm);height:5px;border-radius:3px;overflow:hidden;}
.t-bar{height:100%;background:var(--g-light);border-radius:3px;}
.t-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--gray);}
.t-meta strong{color:var(--char);}
.t-hint{font-size:9px;color:var(--g-light);text-transform:uppercase;letter-spacing:.09em;margin-top:6px;font-weight:500;}
.t-n{font-size:9px;color:var(--gray);margin-top:6px;text-transform:uppercase;letter-spacing:.08em;}
#modal-overlay{position:fixed;inset:0;background:rgba(28,42,25,.45);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
#modal-overlay.show{opacity:1;pointer-events:all;}
#modal{background:var(--cream);border-radius:12px;width:min(560px,92vw);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.2);transform:translateY(12px);transition:transform .2s;}
#modal-overlay.show #modal{transform:translateY(0);}
.modal-head{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px;}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--g-dark);line-height:1.2;}
.modal-sub{font-size:11px;color:var(--gray);margin-top:3px;}
.modal-close{margin-left:auto;background:none;border:none;cursor:pointer;color:var(--gray);padding:4px;font-size:20px;line-height:1;flex-shrink:0;}
.modal-close:hover{color:var(--char);}
.modal-body{overflow-y:auto;padding:16px 24px 24px;}
.modal-avg-row{display:flex;gap:24px;margin-bottom:16px;padding:12px 14px;background:var(--warm);border-radius:6px;}
.modal-stat{display:flex;flex-direction:column;gap:2px;}
.modal-stat-val{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--g-dark);line-height:1;}
.modal-stat-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--gray);}
.job-list{display:flex;flex-direction:column;gap:6px;}
.job-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:5px;background:white;border:1px solid var(--border);}
.job-name{font-size:12px;font-weight:500;color:var(--char);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.job-days{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:var(--g-dark);white-space:nowrap;}
.job-days span{font-size:11px;font-weight:400;color:var(--gray);font-family:'DM Sans',sans-serif;}
.job-bar-wrap{width:80px;height:4px;background:var(--warm);border-radius:2px;overflow:hidden;flex-shrink:0;}
.job-bar{height:100%;border-radius:2px;background:var(--g-light);}
.job-bar.above{background:var(--amber);}
</style>
</head>
<body>
<div id="app">
  <div id="overlay">
    <div class="spinner"></div>
    <div class="ov-title">Loading projects…</div>
    <div class="ov-sub">Fetching live data from Supabase</div>
  </div>
  <header>
    <div><div class="h-title">Design Project Tracker</div><div class="h-sub">Portfolio Report &nbsp;·&nbsp; Elite Kitchen &amp; Bath</div></div>
    <div class="spacer"></div>
    <div class="legend">
      <div class="l-item"><div class="l-dot past"></div>Past</div>
      <div class="l-item"><div class="l-dot future"></div>Scheduled</div>
      <div class="l-item"><div class="l-dot empty"></div>Pending</div>
    </div>
    <div class="ts-badge">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><polyline points="8,4.5 8,8 10.5,10"/></svg>
      <span id="ts">Loading…</span>
    </div>
    <button class="refresh-btn" id="refreshBtn" onclick="loadData()">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M13.5 2.5A7 7 0 1 1 2 8.5"/><path d="M13.5 2.5V6.5H9.5"/>
      </svg>
      Refresh
    </button>
  </header>
  <div id="stats-bar"></div>
  <div id="tabs">
    <div class="tab on" onclick="switchTab('table',this)">Projects</div>
    <div class="tab" onclick="switchTab('timing',this)">Step Timing</div>
  </div>
  <div id="filter-bar"></div>
  <div id="panel-table"><div class="tbl-wrap"><div id="tbl"></div></div></div>
  <div id="panel-timing"></div>
</div>
<div id="modal-overlay" onclick="closeModal(event)">
  <div id="modal">
    <div class="modal-head">
      <div><div class="modal-title" id="modal-title"></div><div class="modal-sub" id="modal-sub"></div></div>
      <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>
<script>
// ── CONFIG ─────────────────────────────────────────────────────
const SUPABASE_URL      = '__SUPABASE_URL__';
const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY__';
let sb = null; // initialized safely inside loadData()

// ── STATE ───────────────────────────────────────────────────────
let allProjects  = [];
let timingData   = [];
let phaseData    = [];
let activeFilter = 'ALL';
let stepOrder    = {};   // step_name → step_number for sorting
let autoTimer    = null;

// ── LOAD DATA FROM SUPABASE ─────────────────────────────────────
async function loadData() {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.classList.add('spin');
  document.getElementById('ts').textContent = 'Loading…';

  try {
    // Create Supabase client — ensure URL has https:// prefix
    if (!sb) {
      let url = SUPABASE_URL.trim();
      if (url && !url.startsWith('http')) url = 'https://' + url;
      sb = supabase.createClient(url, SUPABASE_ANON_KEY.trim());
    }

    const [stepsRes, jobsRes, datesRes] = await Promise.all([
      sb.from('steps').select('id,step_number,step_name').order('step_number'),
      sb.from('jobs').select('id,address,job_type,status').order('created_at',{ascending:false}),
      sb.from('step_dates').select('job_id,step_id,event_date,source'),
    ]);

    if (stepsRes.error) throw new Error('Steps: ' + stepsRes.error.message);
    if (jobsRes.error)  throw new Error('Jobs: '  + jobsRes.error.message);
    if (datesRes.error) throw new Error('Dates: ' + datesRes.error.message);

    const steps    = stepsRes.data || [];
    const jobs     = jobsRes.data  || [];
    const rawDates = datesRes.data || [];

    // Build step lookup maps
    const stepById   = Object.fromEntries(steps.map(s => [s.id, s]));
    stepOrder        = Object.fromEntries(steps.map(s => [s.step_name, s.step_number]));

    // Build date lookup: {job_id: {step_id: {date, source}}}
    // Coerce step_id to Number to avoid string/int mismatch
    const dateLookup = {};
    for (const row of rawDates) {
      if (!dateLookup[row.job_id]) dateLookup[row.job_id] = {};
      dateLookup[row.job_id][Number(row.step_id)] = { date: row.event_date, source: row.source || 'asana' };
    }

    // Build projects array
    allProjects = jobs.map(job => {
      const jDates   = dateLookup[job.id] || {};
      const dates    = {};
      const sources  = new Set();
      for (const s of steps) {
        const d = jDates[Number(s.id)];
        if (d) {
          dates[s.step_name] = d.date;
          sources.add(d.source);
        } else {
          dates[s.step_name] = null;
        }
      }
      const name = (job.address || '') + (job.job_type ? ' - ' + job.job_type : '');
      // Compute a pseudo-phase from highest step with data
      const lastStep = steps.filter(s => jDates[Number(s.id)]).sort((a,b) => b.step_number - a.step_number)[0];
      let phase = null;
      if (lastStep) {
        if (lastStep.step_number >= 15) phase = 'CLOSING';
        else if (lastStep.step_number >= 9)  phase = 'DESIGN';
        else if (lastStep.step_number >= 5)  phase = 'CONCEPTS';
        else if (lastStep.step_number >= 3)  phase = 'BUDGETING';
        else phase = 'PROSPECT';
      }
      return { name, gid: job.id, phase, dates, sources: [...sources] };
    });

    // Compute timing data (consecutive step pairs)
    timingData = [];
    for (let i = 0; i < steps.length - 1; i++) {
      const fromStep = steps[i];
      const toStep   = steps[i+1];
      const entries  = [];
      for (const job of jobs) {
        const jd       = dateLookup[job.id] || {};
        const fromRow  = jd[Number(fromStep.id)];
        const toRow    = jd[Number(toStep.id)];
        if (!fromRow || !toRow) continue;
        const diff = Math.round((new Date(toRow.date) - new Date(fromRow.date)) / 86400000);
        if (diff < 0) continue;
        const jName = (job.address||'') + (job.job_type ? ' - '+job.job_type : '');
        entries.push({ name: jName, days: diff });
      }
      entries.sort((a,b) => a.days - b.days);
      const n   = entries.length;
      const avg = n ? Math.round(entries.reduce((s,e)=>s+e.days,0)/n) : 0;
      timingData.push({
        from: fromStep.step_name, to: toStep.step_name,
        n, entries, avg,
        min: n ? entries[0].days : 0,
        max: n ? entries[n-1].days : 0,
        has_data: n >= 2,
        need: Math.max(0, 2-n),
      });
    }

    // Compute phase summary cards
    function phaseRange(fromNum, toNum, label, color) {
      const fs = steps.find(s=>s.step_number===fromNum);
      const ts = steps.find(s=>s.step_number===toNum);
      if (!fs||!ts) return null;
      const entries = [];
      for (const job of jobs) {
        const jd  = dateLookup[job.id]||{};
        const fd  = jd[fs.id]; const td = jd[ts.id];
        if (!fd||!td) continue;
        const diff = Math.round((new Date(td.date)-new Date(fd.date))/86400000);
        if (diff<0) continue;
        const jName = (job.address||'')+(job.job_type?' - '+job.job_type:'');
        entries.push({name:jName,days:diff});
      }
      entries.sort((a,b)=>a.days-b.days);
      const n=entries.length;
      const avg=n?Math.round(entries.reduce((s,e)=>s+e.days,0)/n):0;
      return {label,color,from:fs.step_name,to:ts.step_name,n,entries,avg,
        min:n?entries[0].days:0,max:n?entries[n-1].days:0,
        has_data:n>=2,need:Math.max(0,2-n)};
    }
    phaseData = [
      phaseRange(1, 4, 'Budget Phase',  '#2D5A41'),
      phaseRange(5, 18,'Design Phase',  '#B8962E'),
    ].filter(Boolean);

    // Update timestamp
    const now = new Date();
    document.getElementById('ts').textContent =
      'Live · Updated ' + now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});

    // Hide overlay and render
    document.getElementById('overlay').classList.add('hidden');
    renderStats();
    renderFilters();
    renderTable();
    renderTiming();

  } catch(e) {
    console.error('Load error:', e);
    document.getElementById('ts').textContent = 'Error loading data';
    // Always hide overlay so user isn't stuck on loading screen
    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('panel-table').style.display = 'flex';
    document.getElementById('tbl').innerHTML =
      '<div class="err-msg" style="padding:40px 24px;text-align:center;color:var(--red);font-size:13px;line-height:1.8">'
      + '⚠ ' + (e.message||'Could not load data from Supabase.').replace(/\n/g,'<br>')
      + '</div>';
  } finally {
    btn.disabled = false;
    btn.classList.remove('spin');
  }
}

// ── HELPERS ─────────────────────────────────────────────────────
function parseD(v){ return v ? new Date(v+'T12:00:00') : null; }
function fmtD(d){
  const now=new Date();
  return d.toLocaleDateString('en-US',
    d.getFullYear()===now.getFullYear()
      ? {month:'short',day:'numeric'}
      : {month:'short',day:'numeric',year:'2-digit'});
}
function isToday(d){ return d.toDateString()===new Date().toDateString(); }

// ── STATS BAR ──────────────────────────────────────────────────
function renderStats(){
  const sb2=document.getElementById('stats-bar');
  const total   = allProjects.length;
  const withDates = allProjects.filter(p=>Object.values(p.dates||{}).some(d=>d)).length;
  const phases  = {};
  allProjects.forEach(p=>{ const ph=p.phase||'—'; phases[ph]=(phases[ph]||0)+1; });
  let html = sv(total,'Total Projects')+dv()+sv(withDates,'With Dates');
  Object.entries(phases).sort((a,b)=>b[1]-a[1]).slice(0,4).forEach(([ph,ct])=>{
    html+=dv()+sv(ct,ph);
  });
  sb2.innerHTML=html;
}
function sv(v,l){ return `<div class="stat"><div class="stat-val">${v}</div><div class="stat-lbl">${l}</div></div>`; }
function dv()   { return `<div class="stat-div"></div>`; }

// ── FILTER BAR ─────────────────────────────────────────────────
function renderFilters(){
  const fb=document.getElementById('filter-bar');
  const phases=['ALL',...[...new Set(allProjects.map(p=>p.phase||'—'))].sort()];
  fb.innerHTML=phases.map(p=>
    `<div class="pill${p===activeFilter?' on':''}" onclick="setFilter('${p}')">${p}</div>`
  ).join('')
  +`<input class="search" id="si" placeholder="Search projects…" oninput="renderTable()">`;
}
function setFilter(p){ activeFilter=p; renderFilters(); renderTable(); }

// ── TABLE ──────────────────────────────────────────────────────
function renderTable(){
  const wrap=document.getElementById('tbl');
  const today=new Date();
  const q=(document.getElementById('si')?.value||'').toLowerCase();

  const projects=allProjects.filter(p=>{
    if(activeFilter!=='ALL'&&(p.phase||'—')!==activeFilter) return false;
    if(q&&!p.name.toLowerCase().includes(q)) return false;
    return true;
  });

  if(!projects.length){
    wrap.innerHTML='<div class="empty">No projects match.</div>';
    return;
  }

  // Build column list from all steps in order
  const cols=[...new Set(
    Object.keys(stepOrder)
  )].sort((a,b)=>(stepOrder[a]||0)-(stepOrder[b]||0));

  let html=`<table><thead><tr>
    <th><div class="th-inner">Project</div></th>
    ${cols.map(c=>`<th title="${c}"><div class="th-inner">${c}</div></th>`).join('')}
  </tr></thead><tbody>`;

  projects.forEach(p=>{
    const dates=p.dates||{};

    // Source badges
    const srcBadges = (p.sources||[]).map(s=>
      `<span class="src-badge ${s}">${s}</span>`
    ).join('');

    html+=`<tr>
      <td class="pname">
        <div class="pn-text" title="${p.name}">${p.name}</div>
        ${srcBadges ? `<div class="src-badges">${srcBadges}</div>` : ''}
      </td>`;

    cols.forEach(c=>{
      const d=parseD(dates[c]);
      if(!d){ html+=`<td class="dcell"><div class="dash"></div></td>`; return; }
      const tod=isToday(d), past=!tod&&d<today;
      const cls=tod?'today':past?'past':'fut';
      html+=`<td class="dcell"><div class="chip ${cls}">${fmtD(d)}</div></td>`;
    });
    html+=`</tr>`;
  });
  wrap.innerHTML=html+'</tbody></table>';
}

// ── TIMING TAB ─────────────────────────────────────────────────
function switchTab(tab,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('filter-bar').style.display  = tab==='table'?'flex':'none';
  document.getElementById('panel-table').style.display = tab==='table'?'flex':'none';
  document.getElementById('panel-timing').classList.toggle('show',tab==='timing');
}

function renderTiming(){
  const panel=document.getElementById('panel-timing');
  const hasData=timingData.filter(r=>r.has_data);
  const maxAvg=hasData.length?Math.max(...hasData.map(r=>r.avg)):1;

  let html=`<div class="timing-header">Step Timing Breakdown</div>
<div class="timing-sub">Average calendar days between stages — ${allProjects.length} projects · minimum 2 entries required · click any card to see individual jobs</div>
<div class="phase-row">`;

  phaseData.forEach((ph,i)=>{
    if(ph.has_data){
      html+=`<div class="ph-sum-card" style="--ph-color:${ph.color}" onclick="openModal(phaseData[${i}])">
  <div class="ph-sum-label">${ph.label}</div>
  <div class="ph-sum-range">${ph.from} → ${ph.to}</div>
  <div class="ph-sum-avg">${ph.avg} <span>days avg</span></div>
  <div class="ph-sum-meta"><span>Min <strong>${ph.min}d</strong></span><span><strong>${ph.n}</strong> projects</span><span>Max <strong>${ph.max}d</strong></span></div>
  <div class="click-hint">↗ Click to see breakdown</div>
</div>`;
    } else {
      html+=`<div class="ph-sum-card no-data" style="--ph-color:#DDD7CC">
  <div class="ph-sum-label">${ph.label}</div>
  <div class="ph-sum-range">${ph.from} → ${ph.to}</div>
  <div class="ph-sum-avg" style="font-size:22px;color:var(--gray)">—</div>
  <div class="t-need" style="margin-top:8px">Need <strong>${ph.need} more</strong> entr${ph.need===1?'y':'ies'}<br><small style="color:var(--gray)">${ph.n} of 2 recorded so far</small></div>
</div>`;
    }
  });

  html+=`</div><div class="timing-divider"><span>Step by Step</span></div><div class="timing-grid">`;

  timingData.forEach((r,i)=>{
    if(r.has_data){
      const pct=Math.round((r.avg/maxAvg)*100);
      html+=`<div class="t-card clickable" onclick="openModal(timingData[${i}])">
  <div class="t-arrow">${r.from} → ${r.to}</div>
  <div class="t-avg">${r.avg} <span>days avg</span></div>
  <div class="t-bar-wrap"><div class="t-bar" style="width:${pct}%"></div></div>
  <div class="t-meta"><span>Min <strong>${r.min}d</strong></span><span><strong>${r.n}</strong> projects</span><span>Max <strong>${r.max}d</strong></span></div>
  <div class="t-hint">↗ Click to see all ${r.n} jobs</div>
</div>`;
    } else {
      html+=`<div class="t-card no-data">
  <div class="t-arrow">${r.from} → ${r.to}</div>
  <div class="t-avg" style="font-size:20px;color:var(--gray)">—</div>
  <div class="t-need">Need <strong>${r.need} more</strong> entr${r.need===1?'y':'ies'} to calculate</div>
  <div class="t-n">${2-r.need} of 2 needed · ${r.n===0?'no data yet':'1 entry recorded'}</div>
</div>`;
    }
  });

  html+=`</div>`;
  panel.innerHTML=html;
}

// ── MODAL ──────────────────────────────────────────────────────
function openModal(row){
  const entries=row.entries||[];
  const maxDays=entries.length?Math.max(...entries.map(e=>e.days)):1;
  const avg=row.avg;
  document.getElementById('modal-title').textContent=row.label||`${row.from} → ${row.to}`;
  document.getElementById('modal-sub').textContent=row.label
    ?`${row.from} → ${row.to} · end-to-end`
    :`Step transition · ${entries.length} projects`;
  let body=`<div class="modal-avg-row">
  <div class="modal-stat"><div class="modal-stat-val">${row.avg}d</div><div class="modal-stat-lbl">Average</div></div>
  <div class="modal-stat"><div class="modal-stat-val">${row.min}d</div><div class="modal-stat-lbl">Fastest</div></div>
  <div class="modal-stat"><div class="modal-stat-val">${row.max}d</div><div class="modal-stat-lbl">Slowest</div></div>
  <div class="modal-stat"><div class="modal-stat-val">${entries.length}</div><div class="modal-stat-lbl">Projects</div></div>
</div><div class="job-list">`;
  entries.forEach(e=>{
    const pct=Math.round((e.days/maxDays)*100);
    body+=`<div class="job-row">
  <div class="job-name" title="${e.name}">${e.name}</div>
  <div class="job-bar-wrap"><div class="job-bar${e.days>avg?' above':''}" style="width:${pct}%"></div></div>
  <div class="job-days">${e.days}<span>d</span></div>
</div>`;
  });
  body+=`</div>`;
  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('modal-overlay').classList.add('show');
}

function closeModal(e){
  if(!e||e.target===document.getElementById('modal-overlay')||e.currentTarget?.classList.contains('modal-close'))
    document.getElementById('modal-overlay').classList.remove('show');
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape') document.getElementById('modal-overlay').classList.remove('show');
});

// ── INIT ───────────────────────────────────────────────────────
document.getElementById('filter-bar').style.display='flex';
document.getElementById('panel-table').style.display='flex';

loadData();
// Auto-refresh every 5 minutes
autoTimer = setInterval(loadData, 5 * 60 * 1000);
</script>
</body>
</html>
