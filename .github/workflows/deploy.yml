name: Deploy Tracker to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject Supabase credentials
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 << 'EOF'
          import os
          url = os.environ['SUPABASE_URL']
          key = os.environ['SUPABASE_ANON_KEY']
          print(f"SUPABASE_URL:      {len(url)} chars, starts with: '{url[:8]}'")
          print(f"SUPABASE_ANON_KEY: {len(key)} chars, starts with: '{key[:4]}'")
          with open('index.html', 'r') as f:
              content = f.read()
          content = content.replace('__SUPABASE_URL__',      url)
          content = content.replace('__SUPABASE_ANON_KEY__', key)
          with open('index.html', 'w') as f:
              f.write(content)
          print("Injection complete.")
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
